name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `enablement: true` turns Pages on and points it at this workflow, so a
      # missing or mis-set Pages source repairs itself on the next push.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        env:
          # Hardcoded rather than read from the configure-pages output: an
          # empty/unexpected value would silently ship a site whose every
          # asset 404s. The repo name is fixed, so this is safe.
          NEXT_PUBLIC_BASE_PATH: /Instagram
        run: npm run build

      # Without this, Pages' Jekyll pass strips Next's _next/ directory.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
