name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

# Pushing the built site to the gh-pages branch is what Pages serves, so this
# needs write access to contents. It deliberately does NOT use the Pages
# deploy API: this repo's Pages source is "deploy from a branch", and the
# environment-based deploy is rejected unless that's switched to "Actions".
permissions:
  contents: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        env:
          # The site is served from https://<user>.github.io/Instagram/, so
          # every asset needs that prefix. Hardcoded rather than derived: an
          # empty value would ship a site whose every asset 404s.
          NEXT_PUBLIC_BASE_PATH: /Instagram
        run: npm run build

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          # Without this, Pages' Jekyll pass strips Next's _next/ directory.
          touch out/.nojekyll
          cd out
          git init -q
          git checkout -qb gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
